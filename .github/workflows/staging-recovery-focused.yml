name: Staging recovery focused browser checks
on:
  pull_request:
    branches: [staging]
    paths:
      - '.github/workflows/staging-recovery-focused.yml'
      - 'public/assets/journal.js'
      - 'public/assets/journal.css'
      - 'public/assets/customer-workspace.js'
      - 'public/assets/customer-workspace.css'
      - 'tests/browser/journal.spec.js'
      - 'tests/browser/customer-workspace.spec.js'
      - 'tests/browser/production-workspace.spec.js'
permissions:
  contents: read
concurrency:
  group: focused-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: veelad_local
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: local
      APP_ORIGIN: http://127.0.0.1:3000
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: veelad_local
      DB_USER: root
      SESSION_SECRET: ci-only-session-secret-with-no-production-access
      MANUAL_TEST_PAYMENTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm run build
      - run: npm run migrate && npm run local:provision
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows - Journal and Studio, desktop/mobile
        run: |
          npm start > /tmp/veelad-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent 'http://127.0.0.1:3000/api.php?route=health' >/dev/null; then break; fi
            sleep 1
          done
          npx playwright test tests/browser/journal.spec.js tests/browser/customer-workspace.spec.js tests/browser/production-workspace.spec.js --reporter=list,github
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: recovery-browser-results
          path: test-results/
