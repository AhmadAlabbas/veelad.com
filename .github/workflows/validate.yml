name: Validate and promote staging
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: veelad_local
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      APP_ENV: local
      APP_ORIGIN: http://127.0.0.1:3000
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: veelad_local
      DB_USER: root
      SESSION_SECRET: ci-only-session-secret-with-no-production-access
      MANUAL_TEST_PAYMENTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: mysql -h127.0.0.1 -uroot -e 'CREATE DATABASE veelad_test'
      - run: npm test
      - run: npm run migrate && npm run local:provision
      - run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: |
          npm start > /tmp/veelad-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent 'http://127.0.0.1:3000/api.php?route=health' >/dev/null; then break; fi
            sleep 1
          done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
  staging:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTINGER_STAGING_DEPLOY_READY == 'true'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance staging branch after validation
        run: git push origin HEAD:refs/heads/staging
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm Hostinger deployed this commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node scripts/verify-deployment.js staging
