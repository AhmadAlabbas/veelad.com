name: Website and database monitoring
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: veelad-availability-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check staging website, database, and storage
        id: staging
        continue-on-error: true
        run: node scripts/monitor.js staging
      - name: Check production website, database, storage and recovery
        id: production
        continue-on-error: true
        run: node scripts/monitor.js production
      - name: Create or resolve an operations alert
        uses: actions/github-script@v7
        env:
          STAGING_RESULT: ${{ steps.staging.outcome }}
          PRODUCTION_RESULT: ${{ steps.production.outcome }}
        with:
          script: |
            const title = '[Operations] Website, database, or storage needs attention';
            const previousTitle = '[Operations] Website or database unavailable';
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100 });
            const existing = issues.find(issue => [title, previousTitle].includes(issue.title) && !issue.pull_request);
            const failed = process.env.STAGING_RESULT !== 'success' || process.env.PRODUCTION_RESULT !== 'success';
            if (failed && existing && existing.title !== title) await github.rest.issues.update({ owner, repo, issue_number: existing.number, title });
            if (failed && !existing) {
              await github.rest.issues.create({ owner, repo, title, body: `Staging readiness: ${process.env.STAGING_RESULT}. Production readiness: ${process.env.PRODUCTION_RESULT}. Checks include private artwork, backup freshness and verified recovery; a storage failure does not necessarily mean the storefront is offline.\n\nReview the [monitor run](https://github.com/${owner}/${repo}/actions/runs/${context.runId}) and Hostinger runtime logs. No credentials or private data are included.` });
            } else if (!failed && existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed' });
            }
            if (failed) core.setFailed('Availability check failed; inspect the operations alert.');
